name: expense_tracker_flutter
description: "Expense Tracker App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & Cloud
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  url_launcher: ^6.3.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.68.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0

  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  app_links: ^6.3.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  pdf: ^3.12.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  csv: ^6.0.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21